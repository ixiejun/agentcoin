# cargo-deny policy (AGENT.md §5.1, design D9 of m0-foundation-pq-crypto).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list anticipates future dependencies; do not warn about unused entries.
unused-allowed-license = "allow"
# Permissive licenses only. GPL-family licenses are evaluated separately when the
# Polkadot SDK client is introduced (M1).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
