# cargo-deny policy (AGENT.md §5.1, design D9 of m0-foundation-pq-crypto).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the check.
version = 2
yanked = "deny"
# BEGIN generated by scripts/sync-audit-exceptions.py — edit audit-exceptions.toml instead
ignore = [
    { id = "RUSTSEC-2026-0119", reason = "CPU exhaustion when *encoding* messages with many names (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2025-0055", reason = "ANSI escape sequences in logged user input can alter terminal output (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2025-0057", reason = "Unmaintained notice only (no vulnerability); used by wasmtime's profiler support inside the SDK executor. (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained notice only (no vulnerability); pulled in by the SDK's networking stack. (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2025-0161", reason = "Unmaintained notice only (no vulnerability) (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2022-0061", reason = "Deprecation notice only (no vulnerability); used by the SDK to read the runtime version section from WASM blobs we build ourselves. (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained notice only (no vulnerability); compile-time proc macro used by FRAME. (see audit-exceptions.toml)" },
    { id = "RUSTSEC-2024-0370", reason = "Unmaintained notice only (no vulnerability); compile-time documentation macro used by FRAME. (see audit-exceptions.toml)" },
]
# END generated

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list anticipates future dependencies; do not warn about unused entries.
unused-allowed-license = "allow"
# Permissive licenses, plus the GPL family used by the GPL licence zone (decision D47, which
# supersedes D37): AgentCoin's own programs, services, tests and scripts are `GPL-3.0-or-later`
# and the Polkadot SDK client crates are `GPL-3.0-or-later WITH Classpath-exception-2.0`. Both
# are allowed here globally because cargo-deny cannot scope a licence to a directory;
# `scripts/check-license-boundary.sh` enforces that only the GPL zone (node/, services/,
# clients/wallet-cli/, tests/, scripts/) may depend on them.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
    # Data licence of the webpki root-certificate bundle (via the jsonrpsee HTTP client).
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
]

# These crates are dual licensed Apache-2.0 / GPL-3.0 but use deprecated SPDX identifiers;
# AgentCoin uses them under Apache-2.0.
[[licenses.clarify]]
crate = "array-bytes"
expression = "Apache-2.0 OR GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "proc-macro-warning"
expression = "Apache-2.0 OR GPL-3.0-only"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Only ac-crypto may use concrete cryptographic implementations (AGENT.md §6.1). The Polkadot SDK
# brings its own older chacha20poly1305 (libp2p Noise) and bip39 (sc-cli) versions, so the bans
# name the versions ac-crypto uses.
deny = [
    { crate = "ml-dsa", wrappers = ["ac-crypto"], reason = "PQ signatures only through ac-crypto" },
    { crate = "x-wing", wrappers = ["ac-crypto"], reason = "hybrid KEM only through ac-crypto" },
    { crate = "ml-kem", wrappers = ["ac-crypto", "x-wing"], reason = "KEM only through ac-crypto" },
    { crate = "argon2", wrappers = ["ac-crypto"], reason = "password KDF only through ac-crypto" },
    { crate = "chacha20poly1305@0.11", wrappers = ["ac-crypto"], reason = "AEAD only through ac-crypto" },
    { crate = "bip39@3", wrappers = ["ac-crypto"], reason = "mnemonics only through ac-crypto" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
