[workspace]
resolver = "3"
members = ["clients/wallet-cli", "tests/e2e", "tests/sim", "crates/ac-crypto", "crates/ac-primitives", "crates/ac-invariants", "pallets/emission", "pallets/treasury-dual", "node", "node/consensus/ac-bft", "node/consensus/aura-pq", "pallets/aura-pq", "pallets/offences", "pallets/pq-accounts", "pallets/randomness-cr", "pallets/validator-set", "runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ixiejun/agentcoin"
authors = ["AgentCoin contributors"]

[workspace.dependencies]
# Cryptography (only `ac-crypto` may depend on these; AGENT.md §6).
ml-dsa = { version = "0.1", default-features = false }
ml-kem = { version = "0.3", default-features = false }
x-wing = { version = "0.1", default-features = false }
blake3 = { version = "1.8", default-features = false }
sha3 = { version = "0.12", default-features = false }
zeroize = { version = "1.9", default-features = false }
subtle = { version = "2.6", default-features = false }
rand_core = { version = "0.10", default-features = false }
getrandom = { version = "0.4", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
bip39 = { version = "3.0", default-features = false, features = ["alloc"] }
parity-scale-codec = { version = "3.7", default-features = false }
scale-info = { version = "2.11", default-features = false }
# Polkadot SDK stable2606 (versions taken from the `polkadot-sdk` 2606.4.0 umbrella manifest).
# Runtime-side crates are declared without default features; the node enables `std`.
frame-benchmarking = { version = "49.0", default-features = false }
frame-benchmarking-cli = { version = "60.0", default-features = false }
frame-executive = { version = "48.0", default-features = false }
frame-support = { version = "48.1", default-features = false }
frame-system = { version = "48.0", default-features = false }
frame-system-benchmarking = { version = "49.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0", default-features = false }
pallet-balances = { version = "50.0", default-features = false }
pallet-timestamp = { version = "48.0", default-features = false }
pallet-transaction-payment = { version = "49.0", default-features = false }
pallet-transaction-payment-rpc = { version = "52.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0", default-features = false }
sc-basic-authorship = { version = "0.56", default-features = false }
sc-chain-spec = { version = "52.0", default-features = false }
sc-cli = { version = "0.62", default-features = false }
sc-client-api = { version = "47.0", default-features = false }
sc-consensus = { version = "0.58", default-features = false }
sc-consensus-slots = { version = "0.58", default-features = false }
sc-executor = { version = "0.50", default-features = false }
sc-network = { version = "0.59", default-features = false }
sc-offchain = { version = "54.0", default-features = false }
sc-service = { version = "0.61", default-features = false }
sc-telemetry = { version = "33.0", default-features = false }
sc-transaction-pool = { version = "47.0", default-features = false }
sc-transaction-pool-api = { version = "46.0", default-features = false }
sp-api = { version = "43.0", default-features = false }
sp-block-builder = { version = "43.0", default-features = false }
sp-blockchain = { version = "46.0", default-features = false }
sp-consensus = { version = "0.49", default-features = false }
sp-consensus-slots = { version = "0.49", default-features = false }
sp-core = { version = "43.0", default-features = false }
sp-genesis-builder = { version = "0.24", default-features = false }
sp-inherents = { version = "43.0", default-features = false }
sp-io = { version = "48.0", default-features = false }
sp-offchain = { version = "43.0", default-features = false }
sp-runtime = { version = "48.0", default-features = false }
sp-session = { version = "45.0", default-features = false }
sp-state-machine = { version = "0.53", default-features = false }
sp-storage = { version = "25.0", default-features = false }
sp-timestamp = { version = "43.0", default-features = false }
sp-transaction-pool = { version = "43.0", default-features = false }
sp-trie = { version = "46.0", default-features = false }
sp-version = { version = "46.0", default-features = false }
substrate-build-script-utils = { version = "11.0", default-features = false }
substrate-frame-rpc-system = { version = "54.0", default-features = false }
substrate-wasm-builder = { version = "34.0", default-features = false }
sc-rpc = { version = "55.0", default-features = false }
# Off-chain async / CLI stack (node, wallet)
clap = { version = "4.5", features = ["derive"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
rpassword = { version = "7.3", default-features = false }
async-trait = { version = "0.1", default-features = false }
substrate-prometheus-endpoint = { version = "0.17", default-features = false }
futures = { version = "0.3", default-features = false }
jsonrpsee = { version = "0.24", default-features = false }
log = { version = "0.4", default-features = false }
tokio = { version = "1.45", default-features = false }
hash-db = { version = "0.16", default-features = false }
hash256-std-hasher = { version = "0.15", default-features = false }
bech32 = { version = "0.12", default-features = false, features = ["alloc"] }
# Workspace crates
ac-crypto = { path = "crates/ac-crypto", version = "0.1", default-features = false }
ac-primitives = { path = "crates/ac-primitives", version = "0.1", default-features = false }
ac-invariants = { path = "crates/ac-invariants", version = "0.1", default-features = false }
ac-wallet = { path = "clients/wallet-cli", version = "0.1", default-features = false }
ac-runtime = { path = "runtime", version = "0.1", default-features = false }
ac-consensus-aura-pq = { path = "node/consensus/aura-pq", version = "0.1", default-features = false }
ac-consensus-bft = { path = "node/consensus/ac-bft", version = "0.1", default-features = false }
pallet-aura-pq = { path = "pallets/aura-pq", version = "0.1", default-features = false }
pallet-ac-offences = { path = "pallets/offences", version = "0.1", default-features = false }
pallet-pq-accounts = { path = "pallets/pq-accounts", version = "0.1", default-features = false }
pallet-emission = { path = "pallets/emission", version = "0.1", default-features = false }
pallet-treasury-dual = { path = "pallets/treasury-dual", version = "0.1", default-features = false }
pallet-randomness-cr = { path = "pallets/randomness-cr", version = "0.1", default-features = false }
pallet-validator-set = { path = "pallets/validator-set", version = "0.1", default-features = false }
# Test-only
hex = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
proptest = { version = "1.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"

# Substrate node builds are large; line tables keep backtraces useful while
# keeping `target/` within CI and container disk budgets.
[profile.dev]
debug = "line-tables-only"
# Incremental artifacts of a Substrate node take several GB and quickly exhaust CI runners and
# cloud containers; full rebuilds of changed crates are fast enough.
incremental = false

# Argon2id with production parameters (64 MiB) is too slow unoptimized for tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Unoptimized Cranelift makes a debug node spend ~30 s compiling the WASM runtime at start-up.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

# The AC-BFT simulator runs 1000 randomized networks in CI; unoptimized it takes minutes.
[profile.dev.package.ac-consensus-bft]
opt-level = 2

[profile.release]
# The runtime and node rely on unwinding to turn host-side panics into errors.
panic = "unwind"
