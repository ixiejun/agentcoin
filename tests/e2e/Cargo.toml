[package]
name = "ac-e2e"
description = "AgentCoin end-to-end tests: multi-node networks driven through RPC and the wallet library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "measure-finality"
path = "src/bin/measure_finality.rs"

[dependencies]
ac-crypto = { workspace = true, features = ["std", "getrandom", "deterministic"] }
ac-market-proto = { workspace = true }
ac-primitives = { workspace = true, features = ["std"] }
ac-runtime = { workspace = true, features = ["std"] }
ac-wallet = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client", "ws-client"] }
pallet-balances = { workspace = true, features = ["std"] }
pallet-collective = { workspace = true, features = ["std"] }
pallet-emission = { workspace = true, features = ["std"] }
pallet-poa-admin = { workspace = true, features = ["std"] }
pallet-ref-rate = { workspace = true, features = ["std"] }
pallet-staking-pos = { workspace = true, features = ["std"] }
pallet-treasury-dual = { workspace = true, features = ["std"] }
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
pallet-pq-accounts = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
