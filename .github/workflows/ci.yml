name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    env:
      # The runtime WASM blob is built and checked by the `runtime-wasm` job.
      SKIP_WASM_BUILD: "1"
      # `--all-features` turns on pallet-revive's benchmarks; skip compiling its test contracts,
      # which needs a nightly RISC-V toolchain and resolc (license-internal-features D5).
      SKIP_PALLET_REVIVE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-substrate
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    env:
      # As in `clippy`: no test runs revive's benchmarks, so its test contracts are not needed.
      SKIP_PALLET_REVIVE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-substrate
      - run: cargo test --workspace --all-features
      - name: Test vectors are reproducible
        run: |
          scripts/fetch-test-vectors.sh
          git diff --exit-code -- crates/ac-crypto/tests/vectors

  no-std-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Runtime-usable crates build for wasm32 without std
        run: |
          for crate in ac-crypto ac-primitives ac-invariants pallet-pq-accounts pallet-aura-pq \
            pallet-validator-set pallet-ac-offences pallet-randomness-cr pallet-emission \
            pallet-treasury-dual pallet-poa-admin pallet-staking-pos pallet-evm-support \
            pallet-ref-rate pallet-model-registry pallet-providers pallet-gateways pallet-credits \
            pallet-work ac-toploc; do
            cargo build -p "$crate" --no-default-features --target wasm32-unknown-unknown
          done
          # The sealed channel stays usable without std (m5-gateway-provider 7.3).
          cargo build -p ac-crypto --no-default-features --features sealed --target wasm32-unknown-unknown

  runtime-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-substrate
      - run: cargo build -p ac-runtime --release
      - name: Runtime blob exists
        run: ls -l target/release/wbuild/ac-runtime/ac_runtime.compact.compressed.wasm
      - name: The release runtime exposes no benchmarking API
        run: |
          scripts/check-release-runtime.sh target/release/wbuild/ac-runtime/ac_runtime.compact.wasm
          scripts/check-release-runtime.sh --self-test

  e2e:
    runs-on: ubuntu-latest
    env:
      AC_E2E: "1"
      AC_E2E_LOGS: ${{ github.workspace }}/target/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-substrate
      - run: cargo build -p ac-node -p ac-wallet -p ac-eth-rpc -p ac-provider -p ac-gateway -p ac-mock-engine
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/cache@v4
        with:
          path: ~/.svm
          key: solc-0.5.16-0.6.6-0.8.28
      # One network at a time: each test runs four to six debug nodes.
      - name: Four-node network, finality, fault tolerance, double signing, randomness, transfers, key rotation, emission, the PoA multisig, the PoA-to-PoS switch, elections, rewards and slashing
        run: >-
          cargo test -p ac-e2e --test local_testnet --test finality --test economics --test pos
          -- --test-threads 1
      - name: EVM contracts through the wallet, the eth-RPC adapter and Foundry
        run: cargo test -p ac-e2e --test evm -- --test-threads 1
      - name: Market registration through the wallet (rate, model, provider, gateway, escrow, vouchers)
        run: cargo test -p ac-e2e --test market -- --test-threads 1
      - name: Work settlement through the wallet (receipts, report, challenge period, emission, claims)
        run: cargo test -p ac-e2e --test settlement -- --test-threads 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenAI SDK for the inference test
        run: pip install -r tests/e2e/python/requirements.txt
      - name: Inference through the market (OpenAI SDK, proxy, gateway, providers, reports, claims, latency, no content in logs)
        run: cargo test -p ac-e2e --test inference -- --test-threads 1 --nocapture
      - name: Local testnet script
        run: AC_TESTNET_DIR="$AC_E2E_LOGS/testnet" scripts/run-local-testnet.sh --check
      - name: Wallet README commands
        run: scripts/wallet-smoke.sh
      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-node-logs
          path: target/e2e-logs
          if-no-files-found: ignore

  contracts:
    # Both Foundry projects (m4-evm): the permissive examples and the Uniswap V2 acceptance
    # project, whose vendored upstream sources must reproduce byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/cache@v4
        with:
          path: ~/.svm
          key: solc-0.5.16-0.6.6-0.8.28
      - name: Example contracts
        working-directory: contracts
        run: forge test
      - name: Uniswap V2 acceptance project
        working-directory: contracts/acceptance
        run: forge test
      - name: Vendored Uniswap V2 sources are reproducible
        run: scripts/vendor-uniswap-v2.sh --check

  toploc-vectors:
    # The TOPLOC vectors are the pinned reference implementation's own output and must
    # reproduce byte for byte (m5-work-settlement 7.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/gen-toploc-vectors.sh
      - name: Vectors are unchanged
        run: git diff --exit-code crates/ac-toploc/tests/vectors/

  vllm-plugin:
    # The vLLM TOPLOC plugin (m5-engine-toploc groups 3 and 7): unit tests with CPU PyTorch, then
    # the plugin inside the pinned CPU build of vLLM with a small public model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-substrate
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('plugins/vllm/ci/pins.env') }}
      - name: PyTorch (CPU) and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install pytest numpy
      - name: Plugin unit tests
        run: python -m pytest -v plugins/vllm
      - name: vLLM (CPU), the plugin, the TOPLOC reference and the model, as pinned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/setup-vllm-cpu.sh
      - name: The vLLM interfaces the auditor's re-check relies on
        run: python scripts/probe-vllm-recheck.py
      - name: The plugin in a real vLLM matches the activations and the reference proofs
        run: python scripts/check-vllm-plugin.py
      - run: cargo build -p ac-node -p ac-wallet -p ac-provider -p ac-gateway -p ac-mock-engine
      - name: Inference through vLLM with the plugin (OpenAI SDK, proxy, gateway, provider, proofs, no content in logs)
        env:
          AC_E2E: "1"
          AC_VLLM_E2E: "1"
        run: cargo test -p ac-e2e --test vllm -- --test-threads 1 --nocapture

  license-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: scripts/check-license-boundary.sh
      - run: scripts/check-license-boundary.sh --self-test

  overmint-flag:
    # The test-only over-minting fault (a compiler flag set only by tests/overmint-runtime)
    # stays out of real builds (m3-economics 8.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: scripts/check-overmint-flag.sh
      - run: scripts/check-overmint-flag.sh --self-test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisory exceptions are documented, current and in sync
        run: |
          python3 -m unittest discover -s scripts/tests
          scripts/sync-audit-exceptions.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
