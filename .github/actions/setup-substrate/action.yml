name: Set up a Substrate build
description: Frees runner disk space, installs protoc and the pinned toolchain, and restores the cargo cache.
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        # Polkadot SDK node builds need well over the ~14 GB free on a default runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Install protoc
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Toolchain
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@v2
