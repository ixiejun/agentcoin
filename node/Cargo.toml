[package]
name = "ac-node"
description = "AgentCoin node client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "ac-node"
path = "src/main.rs"

[dependencies]
ac-consensus-aura-pq = { workspace = true }
ac-consensus-bft = { workspace = true }
async-trait = { workspace = true }
ac-crypto = { workspace = true, features = ["std", "keystore", "getrandom"] }
ac-invariants = { workspace = true, features = ["std"] }
ac-primitives = { workspace = true, features = ["std"] }
ac-runtime = { workspace = true, features = ["std"] }
clap = { workspace = true }
frame-benchmarking = { workspace = true, features = ["std"], optional = true }
frame-system = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
futures = { workspace = true, features = ["std", "thread-pool"] }
jsonrpsee = { workspace = true, features = ["server"] }
log = { workspace = true, features = ["std"] }
sc-basic-authorship = { workspace = true }
sc-chain-spec = { workspace = true }
sc-cli = { workspace = true }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-slots = { workspace = true }
sc-executor = { workspace = true, features = ["std"] }
sc-network = { workspace = true }
sc-service = { workspace = true }
sc-telemetry = { workspace = true }
sc-transaction-pool = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sp-api = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-consensus-slots = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-genesis-builder = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true, features = ["std"] }
substrate-frame-rpc-system = { workspace = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true }

[dev-dependencies]
ac-wallet = { workspace = true }
# Test only: the over-minting runtime the node must reject (m3-economics 8.2).
ac-overmint-runtime = { workspace = true, features = ["std"] }
pallet-collective = { workspace = true, features = ["std"] }
pallet-poa-admin = { workspace = true, features = ["std"] }
pallet-pq-accounts = { workspace = true, features = ["std"] }
frame-support = { workspace = true, features = ["std"] }
ac-crypto = { workspace = true, features = ["std", "keystore"] }
# Independent reference implementation for the hash recomputation tests.
blake3 = { workspace = true, features = ["std"] }
hash-db = { workspace = true, features = ["std"] }
hash256-std-hasher = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
jsonrpsee = { workspace = true, features = ["http-client"] }
parity-scale-codec = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sp-trie = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[features]
default = []
# Runtimes built with benchmarks import the benchmarking host functions; provide them.
runtime-benchmarks = ["dep:frame-benchmarking", "ac-runtime/runtime-benchmarks"]

[lints]
workspace = true
