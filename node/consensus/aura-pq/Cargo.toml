[package]
name = "ac-consensus-aura-pq"
description = "AgentCoin Aura-PQ block authoring and import verification with ML-DSA-65 seals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ac-crypto = { workspace = true, features = ["std", "scale", "getrandom"] }
ac-primitives = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
futures = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-slots = { workspace = true }
sc-telemetry = { workspace = true }
sp-api = { workspace = true, features = ["std"] }
sp-block-builder = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-consensus-slots = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-inherents = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-timestamp = { workspace = true, features = ["std"] }
substrate-prometheus-endpoint = { workspace = true }

[dev-dependencies]
ac-crypto = { workspace = true, features = ["std", "scale", "getrandom", "deterministic"] }

[lints]
workspace = true
