[package]
name = "ac-consensus-bft"
description = "AgentCoin AC-BFT finality gadget: a pure two-phase BFT state machine and its node integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Exposes the deterministic network simulator and the in-memory block tree to other crates'
# tests (and to this crate's README example).
test-utils = []

[dependencies]
ac-crypto = { workspace = true, features = ["std", "scale", "getrandom"] }
ac-primitives = { workspace = true, features = ["std"] }
async-trait = { workspace = true }
futures = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
sc-client-api = { workspace = true }
sc-consensus = { workspace = true }
sc-network = { workspace = true }
sc-transaction-pool-api = { workspace = true }
sp-api = { workspace = true, features = ["std"] }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
substrate-prometheus-endpoint = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "sync", "rt"] }

[dev-dependencies]
ac-crypto = { workspace = true, features = ["std", "scale", "getrandom", "deterministic"] }
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
