[package]
name = "ac-auditor"
description = "AgentCoin auditor agent: re-checks the TOPLOC proofs of inferences against the declared model with a verify-mode engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ac-auditor"
path = "src/main.rs"

[dependencies]
ac-crypto = { workspace = true, features = ["std", "getrandom", "sealed"] }
ac-market-proto = { workspace = true }
ac-primitives = { workspace = true, features = ["std"] }
ac-toploc = { workspace = true, features = ["std"] }
ac-runtime = { workspace = true, features = ["std"] }
ac-wallet = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
frame-support = { workspace = true, features = ["std"] }
pallet-audit = { workspace = true, features = ["std"] }
clap = { workspace = true }
hex = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "sync", "fs", "io-util"] }

[dev-dependencies]
ac-crypto = { workspace = true, features = ["std", "getrandom", "sealed", "deterministic"] }
ac-mock-engine = { workspace = true }

[lints]
workspace = true
