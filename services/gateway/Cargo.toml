[package]
name = "ac-gateway"
description = "AgentCoin inference gateway: sealed OpenAI Chat Completions for users with transparent credits, provider routing, double-signed receipts and automatic work reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ac-gateway"
path = "src/main.rs"

[dependencies]
ac-crypto = { workspace = true, features = ["std", "sealed", "keystore", "getrandom"] }
ac-market-proto = { workspace = true }
ac-primitives = { workspace = true, features = ["std"] }
ac-runtime = { workspace = true, features = ["std"] }
ac-wallet = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
hex = { workspace = true, features = ["std"] }
log = { workspace = true, features = ["std"] }
pallet-work = { workspace = true, features = ["std"] }
parity-scale-codec = { workspace = true, features = ["std"] }
rand_core = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "sync"] }

[dev-dependencies]
ac-mock-engine = { workspace = true }
ac-provider = { workspace = true }

[lints]
workspace = true
