[package]
name = "pallet-evm-support"
description = "AgentCoin EVM support: the contract fee payer, a non-minting currency adapter for pallet-revive and the post-quantum precompiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ac-crypto = { workspace = true }
ac-primitives = { workspace = true }
alloy-core = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-revive = { workspace = true }
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true }

[dev-dependencies]
ac-crypto = { workspace = true, features = ["std", "deterministic"] }
blake3 = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
pallet-balances = { workspace = true, features = ["std"] }
pallet-timestamp = { workspace = true, features = ["std"] }
proptest = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "ac-crypto/std",
    "ac-primitives/std",
    "alloy-core/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-revive/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-runtime/std",
]
runtime-benchmarks = [
    "ac-crypto/deterministic",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-revive/try-runtime",
    "sp-runtime/try-runtime",
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
wildcard_imports = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
