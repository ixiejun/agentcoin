# The following crates appear in Cargo.lock only through optional dependency features that no
# workspace crate enables (hyper 0.14 / libp2p-tls / rcgen); `cargo tree --all-features
# --target all -i <crate>` finds no path, so they are never compiled. `cargo audit` reads the
# lock file and reports them; `cargo deny` evaluates the real graph and does not. They are
# therefore ignored for cargo-audit only.

[[exception]]
id = "RUSTSEC-2026-0258"
crate = "h2 0.3.27"
path = "Cargo.lock only: hyper 0.14 (optional, not enabled) → h2"
reason = "Not compiled into any AgentCoin binary: no enabled feature reaches hyper 0.14."
added = "2026-09-26"
review_by = "2026-12-20"
scope = "audit"

