# Security-advisory exceptions (spec engineering/ci-quality-gates, m1-pq-chain task 10.2).
#
# Every entry records the advisory, the affected crate, how it enters our dependency graph,
# why it is not exploitable here or cannot be fixed from this repository, when it was added and
# a review date at most 90 days later. `scripts/sync-audit-exceptions.py --write` generates the
# ignore lists of `deny.toml` and `.cargo/audit.toml` from this file; CI runs the script in check
# mode, which fails on missing fields, stale review dates or out-of-sync generated lists.

[[exception]]
id = "RUSTSEC-2026-0119"
crate = "hickory-proto 0.24.4"
path = "sc-network → libp2p 0.54 → libp2p-mdns / libp2p-dns → hickory-proto"
reason = "CPU exhaustion when *encoding* messages with many names. The node only encodes DNS queries and mDNS records it builds itself, never attacker-supplied name lists; test networks run with --no-mdns. Fixed only in 0.26.1, which libp2p 0.54 (pinned by the Polkadot SDK) cannot use."
added = "2026-09-26"
review_by = "2026-12-20"

[[exception]]
id = "RUSTSEC-2025-0055"
crate = "tracing-subscriber 0.3.19"
path = "sc-tracing / sp-tracing (pinned to =0.3.19 by the Polkadot SDK)"
reason = "ANSI escape sequences in logged user input can alter terminal output. Node logs are written by the node for operators; the fix (0.3.20) cannot be selected while the SDK pins =0.3.19. Operators should not view untrusted logs in a raw terminal."
added = "2026-09-26"
review_by = "2026-12-20"

